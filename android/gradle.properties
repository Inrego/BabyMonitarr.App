org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's classpath snapshot uses RelocatableFileToPathConverter, which fails on
# Windows when plugin sources live on a different drive than the project (pub
# cache on C:, project on E:). Disable just the snapshot — full incremental
# compilation stays on.
kotlin.incremental.useClasspathSnapshot=false
